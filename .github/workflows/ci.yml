name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Server tests run with coverage; fails below the thresholds in apps/server/vitest.config.ts.
      - run: npm run coverage -w apps/server
      # Web tests run with coverage; fails below the thresholds in apps/web/vite.config.ts.
      - run: npm run coverage -w apps/web
      - run: npm run build
